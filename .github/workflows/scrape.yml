name: Daily scrape

on:
  schedule:
    # 00:30 UTC = 06:00 Sri Lanka time
    - cron: "30 0 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scrape
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # combank.lk's WAF blocks GitHub-hosted runner IPs — Commercial Bank
          # is scraped by Vercel Cron instead (vercel.json).
          SCRAPE_BANKS: hnb
